<div class="app-shell">
  <!-- Desktop / Main Header Navbar -->
  <header class="app-header glass-panel">
    <div class="header-left">
      <a routerLink="/" class="brand-link" (click)="closeMobileMenu()">
        <div class="brand-icon">
          <i class="fi fi-sr-bolt"></i>
        </div>
        <span class="brand-title">Dev<span class="highlight">Flow</span></span>
      </a>

      <nav class="desktop-nav">
        <a routerLink="/projects" routerLinkActive="active" class="nav-link">
          <i class="fi fi-rr-dashboard"></i>
          <span>Dashboard</span>
        </a>
        <a routerLink="/my-work" routerLinkActive="active" class="nav-link">
          <i class="fi fi-rr-user-check"></i>
          <span>My Work</span>
        </a>
        <a routerLink="/inbox" routerLinkActive="active" class="nav-link">
          <i class="fi fi-rr-lightbulb"></i>
          <span>Ideas / Inbox</span>
        </a>
        <a routerLink="/tasks" routerLinkActive="active" class="nav-link">
          <i class="fi fi-rr-list-check"></i>
          <span>Kanban Board</span>
        </a>
      </nav>
    </div>

    <div class="header-right">
      <div class="status-indicator" title="Cloudflare Pages & Supabase Stack">
        <span class="status-dot"></span>
        <span class="status-text">Cloudflare Edge</span>
      </div>

      <button class="mobile-toggle-btn" (click)="toggleMobileMenu()" aria-label="Toggle navigation menu">
        <i [class]="mobileMenuOpen() ? 'fi fi-rr-cross' : 'fi fi-rr-menu-burger'"></i>
      </button>
    </div>
  </header>

  <!-- Mobile Drawer Overlay -->
  @if (mobileMenuOpen()) {
    <div class="mobile-drawer-overlay" (click)="closeMobileMenu()">
      <nav class="mobile-drawer" (click)="$event.stopPropagation()">
        <div class="drawer-header">
          <div class="brand-link">
            <div class="brand-icon">
              <i class="fi fi-sr-bolt"></i>
            </div>
            <span class="brand-title">DevFlow</span>
          </div>
          <button class="btn-close" (click)="closeMobileMenu()">
            <i class="fi fi-rr-cross"></i>
          </button>
        </div>

        <div class="drawer-links">
          <a routerLink="/projects" routerLinkActive="active" class="drawer-link" (click)="closeMobileMenu()">
            <i class="fi fi-rr-dashboard"></i>
            <span>Dashboard</span>
          </a>
          <a routerLink="/my-work" routerLinkActive="active" class="drawer-link" (click)="closeMobileMenu()">
            <i class="fi fi-rr-user-check"></i>
            <span>My Work</span>
          </a>
          <a routerLink="/inbox" routerLinkActive="active" class="drawer-link" (click)="closeMobileMenu()">
            <i class="fi fi-rr-lightbulb"></i>
            <span>Ideas / Inbox</span>
          </a>
          <a routerLink="/tasks" routerLinkActive="active" class="drawer-link" (click)="closeMobileMenu()">
            <i class="fi fi-rr-list-check"></i>
            <span>Kanban Board</span>
          </a>
        </div>

        <div class="drawer-footer">
          <span class="edge-tag"><i class="fi fi-rr-cloud"></i> Deployed on Cloudflare Pages</span>
        </div>
      </nav>
    </div>
  }

  <!-- Main View Container Slot -->
  <main class="app-main">
    <router-outlet />
  </main>

  <!-- Minimalist Developer Shell Footer -->
  <footer class="app-footer">
    <div class="footer-content">
      <div class="footer-left">
        <i class="fi fi-sr-bolt text-cyan"></i>
        <span>DevFlow Personal Workspace</span>
      </div>
      <div class="footer-right">
        <span><i class="fi fi-rr-cloud"></i> Cloudflare Pages</span>
        <span class="separator">•</span>
        <span><i class="fi fi-rr-database"></i> Supabase PostgreSQL</span>
      </div>
    </div>
  </footer>
</div>
