<div class="app-shell">
  <!-- Desktop / Main Header Navbar -->
  <header class="app-header">
    <div class="header-left">
      <a routerLink="/" class="brand-link" (click)="closeMobileMenu()">
        <span class="brand-title">DevFlow</span>
      </a>

      <nav class="desktop-nav">
        <a routerLink="/projects" routerLinkActive="active" class="nav-link">
          <span>Projects</span>
        </a>
        <a routerLink="/my-work" routerLinkActive="active" class="nav-link">
          <span>My Work</span>
        </a>
        <a routerLink="/tasks" routerLinkActive="active" class="nav-link">
          <span>Tasks</span>
        </a>
      </nav>
    </div>

    <div class="header-right">
      <button class="mobile-toggle-btn" (click)="toggleMobileMenu()" aria-label="Toggle navigation menu">
        <i [class]="mobileMenuOpen() ? 'fi fi-rr-cross' : 'fi fi-rr-menu-burger'"></i>
      </button>
    </div>
  </header>

  <!-- Mobile Drawer Overlay -->
  @if (mobileMenuOpen()) {
    <div class="mobile-drawer-overlay" (click)="closeMobileMenu()">
      <nav class="mobile-drawer" (click)="$event.stopPropagation()">
        <div class="drawer-header">
          <span class="brand-title">DevFlow</span>
          <button class="btn-close" (click)="closeMobileMenu()">
            <i class="fi fi-rr-cross"></i>
          </button>
        </div>

        <div class="drawer-links">
          <a routerLink="/projects" routerLinkActive="active" class="drawer-link" (click)="closeMobileMenu()">
            <span>Projects</span>
          </a>
          <a routerLink="/my-work" routerLinkActive="active" class="drawer-link" (click)="closeMobileMenu()">
            <span>My Work</span>
          </a>
          <a routerLink="/tasks" routerLinkActive="active" class="drawer-link" (click)="closeMobileMenu()">
            <span>Tasks</span>
          </a>
        </div>
      </nav>
    </div>
  }

  <!-- Main View Container Slot -->
  <main class="app-main">
    <router-outlet />
  </main>

  <!-- Clean Minimalist Footer -->
  <footer class="app-footer">
    <div class="footer-content">
      <div class="footer-left">
        <span>DevFlow</span>
      </div>
      <div class="footer-right">
        <span>Personal Workspace</span>
      </div>
    </div>
  </footer>
</div>
